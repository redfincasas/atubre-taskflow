window._diagnostics = {
  logs: [],
  errors: [],
  firebaseConnected: false,
  timestamp: new Date().toISOString()
};

const logDiag = (msg, type="log") => {
  const ts = new Date().toLocaleTimeString();
  const entry = `[${ts}] ${msg}`;
  if(type==="error") {
    window._diagnostics.errors.push(entry);
    console.error(entry);
  } else {
    window._diagnostics.logs.push(entry);
    console.log(entry);
  }
};

// ── CLOUDINARY UPLOAD ─────────────────────────────
async function uploadToCloudinary(file, onProgress) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CLOUDINARY_PRESET);
  fd.append("folder", "atubre-taskflow");
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const resourceType = file.type.startsWith("video") ? "video" : "auto";
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resourceType}/upload`);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = () => {
      const res = JSON.parse(xhr.responseText);
      if (res.secure_url) resolve(res);
      else reject(new Error(res.error?.message || "Upload failed"));
    };
    xhr.onerror = () => reject(new Error("Network error"));
    xhr.send(fd);
  });
}

function fileIcon(type) {
  if (type?.startsWith("image")) return "🖼️";
  if (type?.startsWith("video")) return "🎥";
  if (type?.includes("pdf"))     return "📄";
  return "📎";
}

function mediaPreviewHTML(uploads, taskId) {
  if (!uploads || uploads.length === 0) return "";
  return `<div class="media-grid">${uploads.map((u, idx) => {
    const canDelete = cu.role === "admin" || u.uploadedById === cu.id;
    const delBtn = canDelete
      ? `<button class="del-file-btn" onclick="deleteUpload('${taskId}', ${idx})" title="Delete file">🗑️</button>`
      : "";
    if (u.type?.startsWith("image")) {
      return `<div class="media-item">
        <div class="media-item-top">
          <img src="${u.url}" onclick="openLightbox('${u.url}')" class="media-thumb" title="${u.name}">
          ${delBtn}
        </div>
        <div class="media-meta">${u.uploadedBy} · ${fmt(u.uploadedAt)}</div>
      </div>`;
    } else if (u.type?.startsWith("video")) {
      return `<div class="media-item">
        <div class="media-item-top" style="flex-direction:column;align-items:flex-start;">
          <video src="${u.url}" controls class="media-video"></video>
          <div style="display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:4px;">
            <div class="media-meta">${fileIcon(u.type)} ${u.name} · ${u.uploadedBy} · ${fmt(u.uploadedAt)}</div>
            ${delBtn}
          </div>
        </div>
      </div>`;
    } else {
      return `<div class="media-item media-doc">
        <div class="media-item-top">
          <a href="${u.url.replace('/upload/', '/upload/fl_attachment/')}" download="${u.name}" class="doc-link">${fileIcon(u.type)} ${u.name} ⬇</a>
          ${delBtn}
        </div>
        <div class="media-meta">${u.uploadedBy} · ${fmt(u.uploadedAt)}</div>
      </div>`;
    }
  }).join("")}</div>`;
}

window.deleteUpload = async (taskId, idx) => {
  if (!confirm("Remove this file from the task?")) return;
  const t = (window._tasks||[]).find(x => x.id === taskId);
  if (!t) return;
  const newUploads = (t.uploads||[]).filter((_, i) => i !== idx);
  await updateDoc(doc(db,"tasks",taskId), { uploads: newUploads });
  await logAct(`${cu.name} removed a file from: "${t.title}"`, "delete", taskId);
  toast("File removed ✓", "success");
};

// ── UPLOAD MODAL ──────────────────────────────────
window.openUploadModal = taskId => {
  uploadingTaskId = taskId;
  $("upload-input").value = "";
  $("upload-progress").style.display = "none";
  $("upload-preview").innerHTML = "";
  $("upload-modal").classList.add("open");
};

window.handleUpload = async () => {
  const files = $("upload-input").files;
  if (!files.length) return toast("Please select a file first.", "error");
  const maxSize = 100 * 1024 * 1024;
  for (const f of files) {
    if (f.size > maxSize) return toast(`${f.name} is too large. Max 100MB.`, "error");
  }
  $("upload-btn").textContent = "Uploading...";
  $("upload-btn").disabled = true;
  $("upload-progress").style.display = "block";
  try {
    const task = (window._tasks||[]).find(x=>x.id===uploadingTaskId);
    const existing = task?.uploads || [];
    const newUploads = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      $("upload-progress-label").textContent = `Uploading ${file.name} (${i+1}/${files.length})...`;
      $("upload-bar").style.width = "0%";
      const result = await uploadToCloudinary(file, pct => {
        $("upload-bar").style.width = pct + "%";
        $("upload-bar-label").textContent = pct + "%";
      });
      newUploads.push({
        url: result.secure_url,
        type: file.type,
        name: file.name,
        uploadedBy: cu.name,
        uploadedById: cu.id,
        uploadedAt: new Date().toISOString(),
        publicId: result.public_id
      });
    }
    await updateDoc(doc(db,"tasks",uploadingTaskId), {
      uploads: [...existing, ...newUploads]
    });
    await logAct(`${cu.name} uploaded ${newUploads.length} file(s) to task: "${task?.title}"`, "upload", uploadingTaskId);
    if (cu.role === "member") {
      await notifyAdmins(`${cu.name} uploaded ${newUploads.length} file(s) to: "${task?.title}"`, "upload", uploadingTaskId);
    }
    toast(`${newUploads.length} file(s) uploaded successfully! ✅`, "success");
    closeModal("upload-modal");
  } catch(e) {
    toast("Upload failed: " + e.message, "error");
  }
  $("upload-btn").textContent = "Upload";
  $("upload-btn").disabled = false;
};

window.previewFiles = () => {
  const files = $("upload-input").files;
  const prev = $("upload-preview");
  prev.innerHTML = [...files].map(f => {
    if (f.type.startsWith("image")) {
      const url = URL.createObjectURL(f);
      return `<div class="prev-item"><img src="${url}" class="prev-thumb"><span>${f.name}</span></div>`;
    }
    return `<div class="prev-item">${fileIcon(f.type)} <span>${f.name}</span></div>`;
  }).join("");
};

window.switchAuthTab = tab => {
  document.querySelectorAll(".auth-tab").forEach((b,i)=>b.classList.toggle("active",(i===0)===(tab==="login")));
  $("login-form").style.display   = tab==="login"    ? "" : "none";
  $("register-form").style.display= tab==="register" ? "" : "none";
  $("auth-error").style.display   = "none";
};

const authErr = m => { const e=$("auth-error"); e.textContent=m; e.style.display="block"; };

window.handleLogin = async () => {
  const email=$("login-email").value.trim(), pass=$("login-password").value;
  if (!email||!pass) return authErr("Please fill in all fields.");
  $("login-btn").textContent="Logging in...";
  try { await signInWithEmailAndPassword(auth,email,pass); }
  catch(e){ authErr("Invalid email or password."); $("login-btn").textContent="Log In"; }
};

window.handleRegister = async () => {
  const name=$("reg-name").value.trim(), email=$("reg-email").value.trim(),
        pass=$("reg-password").value, role=$("reg-role").value, code=$("reg-admin-code").value;
  if (!name||!email||!pass) return authErr("Please fill in all fields.");
  if (pass.length<6) return authErr("Password must be at least 6 characters.");
  if (role==="admin"&&code!==ADMIN_CODE) return authErr("Invalid admin invite code.");
  $("register-btn").textContent="Creating...";
  try {
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    await updateProfile(cred.user,{displayName:name});
    const approved = role==="admin";
    await setDoc(doc(db,"users",cred.user.uid),{
      name, email, role, approved,
      createdAt: serverTimestamp()
    });
    if (!approved) {
      const adminSnap = await getDocs(query(collection(db,"users"),where("role","==","admin")));
      for (const d of adminSnap.docs) {
        await addDoc(collection(db,"notifications"),{
          recipientId: d.id,
          msg: `New registration pending approval: ${name} (${email}) — Team Member`,
          type: "approval",
          userId: cred.user.uid,
          read: false,
          createdAt: serverTimestamp()
        });
      }
      await signOut(auth);
      $("auth-screen").style.display="none";
      $("pending-screen").style.display="flex";
      return;
    }
  } catch(e){
    authErr(e.message.includes("email-already-in-use")?"Email already registered.":e.message);
    $("register-btn").textContent="Create Account";
  }
};

window.handleLogout = async () => { unsubs.forEach(u=>u()); unsubs=[]; await signOut(auth); };

onAuthStateChanged(auth, async user => {
  if (user) {
    const snap=await getDoc(doc(db,"users",user.uid));
    if (!snap.exists()){ await signOut(auth); return; }
    const profile = snap.data();
    if (!profile.approved && profile.role !== "admin") {
      await signOut(auth);
      $("auth-screen").style.display="none";
      $("pending-screen").style.display="flex";
      return;
    }
    cu={id:user.uid,...snap.data()};
    logDiag(`User logged in: ${cu.name} (${cu.role})`);
    $("pending-screen").style.display="none";
    initApp();
  } else {
    cu=null;
    $("pending-screen").style.display="none";
    $("auth-screen").style.display="flex";
    $("app-screen").style.display="none";
  }
});

function initApp() {
  $("auth-screen").style.display="none";
  $("app-screen").style.display="flex";
  $("user-name-display").textContent=cu.name.split(" ")[0];
  $("user-avatar").textContent=ini(cu.name);
  const b=$("role-badge"); b.textContent=cu.role==="admin"?"Admin":"Member";
  b.className="role-badge "+(cu.role==="admin"?"badge-admin":"badge-member");
  document.querySelectorAll(".admin-only").forEach(el=>el.style.display=cu.role==="admin"?"":"none");
  document.querySelectorAll(".member-only").forEach(el=>el.style.display=cu.role==="member"?"":"none");
  subscribeAll();
  subscribeIntel();
  const urlParams = new URLSearchParams(window.location.search);
  const deepTaskId = urlParams.get("task");
  if(deepTaskId){
    window._deepLinkTaskId = deepTaskId;
    showPage("dashboard");
  } else {
    showPage("dashboard");
  }
}

function subscribeAll(){
  unsubs.forEach(u=>u()); unsubs=[];
  logDiag("Subscribing to tasks collection...");
  unsubs.push(onSnapshot(query(collection(db,"tasks"),orderBy("createdAt","desc")), snap=>{
    logDiag(`✅ Tasks loaded: ${snap.docs.length} tasks received`);
    window._tasks=snap.docs.map(d=>({id:d.id,...d.data()}));
    window._diagnostics.firebaseConnected = true;
    renderPage(currentPage);
    if(window._deepLinkTaskId){
      const dlTask=(window._tasks||[]).find(x=>x.id===window._deepLinkTaskId);
      if(dlTask){
        window._deepLinkTaskId=null;
        openTaskDetailModal(dlTask.id);
      }
    }
    const stId=$("subtask-task-id")?.value;
    if(stId&&$("subtask-modal").classList.contains("open")){
      const t=(window._tasks||[]).find(x=>x.id===stId);
      if(t) renderSubtaskList(t);
    }
    const cmId=$("comments-task-id")?.value;
    if(cmId&&$("comments-modal").classList.contains("open")){
      const t=(window._tasks||[]).find(x=>x.id===cmId);
      if(t) renderCommentsList(t);
    }
    if(cu.role==="admin"){
      const privatePending=(window._tasks||[]).filter(t=>
        t.type==="private" &&
        t.status==="pending" &&
        !(t.privateAcceptedBy||[]).find(a=>a.uid===cu.id) &&
        (t.ownerId===cu.id||(t.sharedWith||[]).includes(cu.id))
      ).length;
      const pb=$("nav-private-badge");
      if(pb){ pb.textContent=privatePending; pb.style.display=privatePending>0?"":"none"; }
    }
    const uid=cu.id;
    const inProgressCount=(window._tasks||[]).filter(t=>{
      if(t.type==="assigned") return (t.acceptedBy||[]).find(a=>a.uid===uid)&&!(t.completedBy||[]).find(c=>c.uid===uid);
      if(t.type==="pool") return (t.claims||[]).find(c=>c.uid===uid&&!c.completedAt);
      if(t.type==="private"&&cu.role==="admin") return (t.privateAcceptedBy||[]).find(a=>a.uid===uid)&&!(t.privateCompletedBy||[]).find(c=>c.uid===uid);
      return false;
    }).length;
    const ipb=$("nav-inprogress-badge");
    if(ipb){ ipb.textContent=inProgressCount; ipb.style.display=inProgressCount>0?"":"none"; }
  }, err => {
    logDiag(`❌ Firestore subscription error: ${err.message}`, "error");
    logDiag(`   Code: ${err.code}`, "error");
    window._diagnostics.firebaseConnected = false;
    if(err.code === "permission-denied") {
      toast("❌ Firebase Permission Denied. Check security rules and API key.", "error");
    } else if(err.code === "unavailable") {
      toast("⚠️ Firebase service unavailable. Check your internet connection.", "error");
    } else {
      toast(`Firebase error: ${err.message}`, "error");
    }
  }));

  unsubs.push(onSnapshot(query(collection(db,"notifications"),
    where("recipientId","==",cu.id),orderBy("createdAt","desc")), snap=>{
    window._notifs=snap.docs.map(d=>({id:d.id,...d.data()}));
    $("notif-dot").style.display=window._notifs.filter(n=>!n.read).length>0?"":"none";
  }));

  if(cu.role==="admin"){
    unsubs.push(onSnapshot(query(collection(db,"users"),where("approved","==",false)), snap=>{
      const pending=snap.docs.filter(d=>d.data().role!=="admin").length;
      const badge=$("nav-team-badge");
      if(badge){
        badge.textContent=pending;
        badge.style.display=pending>0?"":"none";
      }
    }));
  }
}

// ── NAV ───────────────────────────────────────────
window.showPage = name => {
  const adminPages = ["private","activity","all-tasks","team"];
  if(cu && cu.role==="member" && adminPages.includes(name)) {
    toast("Access restricted to admins only","error"); return;
  }
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const pg=$("page-"+name); if(pg) pg.classList.add("active");
  const nb=$("nav-"+name);  if(nb) nb.classList.add("active");
  currentPage=name; renderPage(name); closeNotifPanel();
};

function applyPriorityFilter(T){
  if(priorityFilter==="all") return T;
  return T.filter(t=>t.priority===priorityFilter);
}

window.setPriorityFilter = (f) => {
  priorityFilter=f;
  document.querySelectorAll(".pri-filter-btn").forEach(b=>b.classList.remove("active"));
  const btn = document.getElementById("pf-"+f);
  if(btn) btn.classList.add("active");
  renderPage(currentPage);
};

function renderPage(name){
  const T=applyPriorityFilter(window._tasks||[]);
  if(name==="dashboard") renderDashboard(window._tasks||[]);
  if(name==="my-tasks")  renderMyTasks(T);
  if(name==="in-progress") renderInProgress(T);
  if(name==="pool")      renderPool(T);
  if(name==="private")   renderPrivate(T);
  if(name==="all-tasks") renderAllTasks(T);
  if(name==="team")      renderTeam(window._tasks||[]);
  if(name==="activity")  renderActivity();
}

// ── DASHBOARD ─────────────────────────────────────
function renderDashboard(T){
  const h=new Date().getHours();
  $("dash-greeting").textContent=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+", "+cu.name.split(" ")[0]+" ⚡";
  $("dash-sub").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const isA=cu.role==="admin";
  const uid=cu.id;
  const myAssigned=T.filter(t=>t.type==="assigned"&&(t.assignees||[]).includes(uid));
  const poolTasks=T.filter(t=>t.type==="pool");
  const myClaimed=poolTasks.filter(t=>(t.claims||[]).find(c=>c.uid===uid));
  const availableUnclaimed=poolTasks.filter(t=>!(t.claims||[]).find(c=>!c.completedAt)&&t.status!=="completed");
  const totalCount=isA?T.length:myAssigned.length+myClaimed.length+availableUnclaimed.length;
  const pendingCount=isA?T.filter(t=>t.status==="pending").length:
    myAssigned.filter(t=>t.status==="pending").length;
  const inProgressCount=isA?T.filter(t=>t.status==="accepted").length:
    T.filter(t=>{
      if(t.type==="assigned") return (t.acceptedBy||[]).find(a=>a.uid===uid)&&!(t.completedBy||[]).find(c=>c.uid===uid);
      if(t.type==="pool") return (t.claims||[]).find(c=>c.uid===uid&&!c.completedAt);
      return false;
    }).length;
  const completedCount=isA?T.filter(t=>t.status==="completed").length:
    T.filter(t=>{
      if(t.type==="assigned") return (t.completedBy||[]).find(c=>c.uid===uid);
      if(t.type==="pool") return (t.claims||[]).find(c=>c.uid===uid&&c.completedAt);
      return false;
    }).length;
  const myInProgressPool=poolTasks.filter(t=>(t.claims||[]).find(c=>c.uid===uid&&!c.completedAt));
  const myCompletedPool=poolTasks.filter(t=>(t.claims||[]).find(c=>c.uid===uid&&c.completedAt));
  const recentTasks=isA?T.slice(0,5):[
    ...myAssigned,
    ...myInProgressPool,
    ...myCompletedPool
  ].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,5);
  const vis=isA?T:[...myAssigned,...poolTasks];
  const tapHint=`<div style="font-size:.6rem;margin-top:4px;font-family:Orbitron,sans-serif;letter-spacing:.05em;opacity:.7;">TAP TO VIEW ›</div>`;
  $("stats-row").innerHTML=`
    <div class="stat-card cyan clickable-stat" onclick="openStatModal('all')" title="View all tasks">
      <div class="stat-num">${vis.length}</div>
      <div class="stat-label">Total Tasks</div>
      ${tapHint}
    </div>
    <div class="stat-card gold clickable-stat" onclick="openStatModal('pending')" title="View pending tasks">
      <div class="stat-num">${pendingCount}</div>
      <div class="stat-label">Pending</div>
      ${tapHint}
    </div>
    <div class="stat-card blue clickable-stat" onclick="openStatModal('inprogress')" title="View in progress tasks">
      <div class="stat-num">${inProgressCount}</div>
      <div class="stat-label">In Progress</div>
      ${tapHint}
    </div>
    <div class="stat-card green clickable-stat" onclick="${cu.role==='admin'?'openCompletedReport()':'openStatModal(\'completed\')'}" title="View completed tasks">
      <div class="stat-num">${completedCount}</div>
      <div class="stat-label">Completed</div>
      ${tapHint}
    </div>`;
  $("dash-recent").innerHTML=recentTasks.map(t=>miniCard(t)).join("")||empty("📭","No tasks yet");
  if(cu.role==="admin") renderIntelList();
  const myOpen=T.filter(t=>(t.assignees||[]).includes(cu.id)&&t.status!=="completed").length;
  const poolOpen=cu.role==="admin"
    ? T.filter(t=>t.type==="pool"&&t.status!=="completed"&&!(t.claims||[]).find(c=>c.uid===cu.id&&!c.completedAt)).length
    : T.filter(t=>t.type==="pool"&&t.status!=="completed"&&!(t.claims||[]).find(c=>!c.completedAt)).length;
  const myInProgress=T.filter(t=>{
    if(t.type==="assigned") return (t.acceptedBy||[]).find(a=>a.uid===cu.id)&&!(t.completedBy||[]).find(c=>c.uid===cu.id);
    if(t.type==="pool") return (t.claims||[]).find(c=>c.uid===cu.id&&!c.completedAt);
    return false;
  }).length;
  $("nav-my-badge").textContent=myOpen; $("nav-my-badge").style.display=myOpen>0?"":"none";
  $("nav-pool-badge").textContent=poolOpen; $("nav-pool-badge").style.display=poolOpen>0?"":"none";
  const ipb=$("nav-inprogress-badge");
  if(ipb){ ipb.textContent=myInProgress; ipb.style.display=myInProgress>0?"":"none"; }
}

function miniCard(t){
  const tc={assigned:"tag-cyan",pool:"tag-gold",private:"tag-purple"}[t.type]||"tag-gray";
  const tl={assigned:"Assigned",pool:"Pool",private:"🔒 Private"}[t.type]||t.type;
  const sc={pending:"tag-gray",accepted:"tag-gold",completed:"tag-green"}[t.status];
  const uploads=(t.uploads||[]).length;
  const dest={assigned:cu.role==="admin"?"all-tasks":"my-tasks",pool:"pool",private:cu.role==="admin"?"private":"dashboard"}[t.type]||"dashboard";
  return `<div class="task-card">
    <div class="task-priority pri-${t.priority||"low"}" style="cursor:pointer;" onclick="showPage('${dest}')"></div>
    <div class="task-body" style="cursor:pointer;" onclick="showPage('${dest}')">
      <div class="task-title">${t.title}</div>
      <div class="task-meta">
        <span class="tag ${tc}">${tl}</span>
        <span class="tag ${sc}">${t.status}</span>
        ${uploads>0?`<span class="tag tag-cyan">📎 ${uploads} file${uploads>1?"s":""}</span>`:""}
        ${t.due?`<span class="task-date">📅 ${t.due}</span>`:""}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button class="btn btn-ghost btn-sm" onclick="shareTask('${t.id}')" title="Share task" style="padding:4px 8px;font-size:.7rem;">🔗</button>
      <div style="color:var(--muted);font-size:.8rem;cursor:pointer;" onclick="showPage('${dest}')">›</div>
    </div>

}

function uploadBtn(taskId) {
  return `<button class="btn btn-ghost btn-sm" onclick="openUploadModal('${taskId}')">📎 Upload File</button>`;
}

// ── MY TASKS ──────────────────────────────────────
function renderMyTasks(T){
  const mine=T.filter(t=>(t.assignees||[]).includes(cu.id));
  $("my-tasks-list").innerHTML=mine.length?mine.map(t=>assignedCard(t)).join(""):empty("🎯","No tasks assigned to you yet");
}

function assignedCard(t){
  const accepted =(t.acceptedBy||[]).find(a=>a.uid===cu.id);
  const completed=(t.completedBy||[]).find(a=>a.uid===cu.id);
  let actions="";
  if(!accepted&&!completed&&t.status!=="completed")
    actions=`<div class="btn-row">
               <button class="btn btn-gold btn-sm" onclick="acceptTask('${t.id}')">⚡ Accept &amp; Start</button>
               ${uploadBtn(t.id)}
             </div>`;
  else if(accepted&&!completed)
    actions=`<div class="time-stamp">⏱ Started: ${fmt(accepted.startedAt)}</div>
             <div class="btn-row">
               <button class="btn btn-green btn-sm" onclick="completeTask('${t.id}')">✅ Mark Complete</button>
               ${uploadBtn(t.id)}
               <button class="btn btn-ghost btn-sm" onclick="cancelAccept('${t.id}')" style="color:var(--red);border-color:rgba(255,75,110,.3);">↩ Cancel Task</button>
             </div>`;
  else if(completed)
    actions=`<div class="time-stamp">⏱ Started: ${fmt(accepted?.startedAt)}</div>
             <div class="time-stamp done">✅ Completed: ${fmt(completed.completedAt)}</div>
             <div class="btn-row">${uploadBtn(t.id)}</div>`;
  else
    actions=`<div class="btn-row">${uploadBtn(t.id)}</div>`;
  return fullTaskCard(t,"tag-cyan","👤 Assigned to you",actions);
}

// ── IN PROGRESS ───────────────────────────────────
function renderInProgress(T){
  const uid=cu.id;
  const assignedInProgress=T.filter(t=>
    t.type==="assigned" &&
    (t.acceptedBy||[]).find(a=>a.uid===uid) &&
    !(t.completedBy||[]).find(c=>c.uid===uid)
  );
  const poolInProgress=T.filter(t=>
    t.type==="pool" &&
    (t.claims||[]).find(c=>c.uid===uid&&!c.completedAt)
  );
  const privateInProgress=cu.role==="admin"?T.filter(t=>
    t.type==="private" &&
    (t.privateAcceptedBy||[]).find(a=>a.uid===uid) &&
    !(t.privateCompletedBy||[]).find(c=>c.uid===uid)
  ):[];
  const all=[...assignedInProgress,...poolInProgress,...privateInProgress];
  if(!all.length){
    $("inprogress-list").innerHTML=empty("⚡","No tasks in progress — claim a task from the Open Pool or accept an assigned task");
    return;
  }
  $("inprogress-list").innerHTML=all.map(t=>{
    const isAssigned=t.type==="assigned";
    const isPrivate=t.type==="private";
    const accepted=isAssigned?(t.acceptedBy||[]).find(a=>a.uid===uid):null;
    const claim=t.type==="pool"?(t.claims||[]).find(c=>c.uid===uid):null;
    const privAccepted=isPrivate?(t.privateAcceptedBy||[]).find(a=>a.uid===uid):null;
    const startTime=accepted?.startedAt||claim?.startedAt||privAccepted?.startedAt;
    const completeAction=isAssigned?`completeTask('${t.id}')`:isPrivate?`completePrivate('${t.id}')`:`completePool('${t.id}')`;
    const cancelAction=isAssigned?`cancelAccept('${t.id}')`:isPrivate?`cancelPrivateStart('${t.id}')`:`cancelClaim('${t.id}')`;
    const cancelLabel=isAssigned?"↩ Cancel Task":isPrivate?"↩ Cancel":"↩ Release to Pool";
    const tagCls=isAssigned?"tag-cyan":isPrivate?"tag-purple":"tag-gold";
    const tagLabel=isAssigned?"👤 Assigned":isPrivate?"🔒 Private":"🌊 Pool";
    const actions=`
      <div class="time-stamp">⏱ Started: ${fmt(startTime)}</div>
      <div class="btn-row">
        <button class="btn btn-green btn-sm" onclick="${completeAction}">✅ Mark Complete</button>
        <button class="btn btn-ghost btn-sm" onclick="openUploadModal('${t.id}')">📎 Upload File</button>
        <button class="btn btn-ghost btn-sm" onclick="${cancelAction}" style="color:var(--red);border-color:rgba(255,75,110,.3);">${cancelLabel}</button>
      </div>`;
    return fullTaskCard(t, tagCls, tagLabel, actions);
  }).join("");
}

// ── POOL ──────────────────────────────────────────
function renderPool(T){
  const uid=cu.id;
  const isA=cu.role==="admin";
  const pool=T.filter(t=>{
    if(t.type!=="pool") return false;
    if(t.status==="completed") return false;
    const claims=t.claims||[];
    if(isA){
      return !claims.find(c=>c.uid===uid&&!c.completedAt);
    } else {
      if(claims.find(c=>c.uid===uid&&!c.completedAt)) return false;
      if(claims.find(c=>!c.completedAt)) return false;
      return true;
    }
  });
  const emptyMsg = priorityFilter!=="all"
    ? `No ${priorityFilter} priority tasks in the pool`
    : isA ? "No pool tasks yet — add one with + Add Pool Task" : "No available tasks right now — check back later";
  $("pool-list").innerHTML=pool.length?pool.map(t=>poolCard(t)).join(""):empty("🌊", emptyMsg);
}

               <button class="btn btn-green btn-sm" onclick="completePool('${t.id}')">✅ Mark Complete</button>
               ${uploadBtn(t.id)}

             </div>`;

    actions=`<div class="time-stamp">⏱ Started: ${fmt(myEntry.startedAt)}</div>

    <div class="task-card-top">
      <div style="flex:1;">

        ${t.isFollowUp?followUpBanner:(t.desc?`<div class="task-desc">${t.desc}</div>`:"")}

          <span class="tag tag-gold">🌊 Open Pool</span>
          ${t.tag?`<span class="tag tag-soft">${t.tag}</span>`:""}
          <span class="pri-tag-${t.priority||"low"}">${t.priority}</span>
          ${t.due?`<span class="task-date">📅 ${t.due}</span>`:""}
          ${claimCount>0?`<span class="task-date">👤 ${claimCount} working</span>`:""}
          ${(t.uploads||[]).length>0?`<span class="tag tag-cyan">📎 ${t.uploads.length} file(s)</span>`:""}

// ── PRIVATE ───────────────────────────────────────
function renderPrivate(T){
  const uid=cu.id;
  const mine=T.filter(t=>t.type==="private"&&(t.ownerId===uid||(t.sharedWith||[]).includes(uid)));
  const pending=mine.filter(t=>t.status==="pending"&&!(t.privateAcceptedBy||[]).find(a=>a.uid===uid));
  const inProg=mine.filter(t=>(t.privateAcceptedBy||[]).find(a=>a.uid===uid)&&!(t.privateCompletedBy||[]).find(c=>c.uid===uid));

  if(pending.length>0){
    html+=`<div class="section-title">Pending (${pending.length})</div>`;

    html+=`<div class="section-title" style="margin-top:20px;">⚡ In Progress (${inProg.length})</div>`;
    html+=inProg.map(t=>privateCard(t)).join("");

  $("private-list").innerHTML=html||empty("🔒","No private tasks yet — create your first one above");
}

function privateCard(t){
  const uid=cu.id;
  const isOwner=t.ownerId===uid;
  const accepted=(t.privateAcceptedBy||[]).find(a=>a.uid===uid);
  const completed=(t.privateCompletedBy||[]).find(c=>c.uid===uid);

    action=`<button class="btn btn-gold btn-sm" onclick="startPrivate('${t.id}')">⚡ Start Task</button>`;
  else if(accepted&&!completed)
    action=`<div class="time-stamp">⏱ Started: ${fmt(accepted.startedAt)}</div>
            <div class="btn-row">
              <button class="btn btn-green btn-sm" onclick="completePrivate('${t.id}')">✅ Mark Done</button>
              ${uploadBtn(t.id)}

            </div>`;
  return `<div class="task-accept-card">
    <div class="task-card-top">
      <div style="flex:1;">
        <div class="task-title">${t.title}</div>
        ${t.desc?`<div class="task-desc">${t.desc}</div>`:""}
        <div class="task-meta" style="margin-top:8px;">

          ${t.tag?`<span class="tag tag-soft">${t.tag}</span>`:""}

          ${(t.uploads||[]).length>0?`<span class="tag tag-cyan">📎 ${t.uploads.length} file(s)</span>`:""}

// ── ALL TASKS (admin) ─────────────────────────────
window._af="all";
window.filterAll=(f,btn)=>{
  window._af=f;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderAllTasks(window._tasks||[]);
};

function renderAllTasks(T){
  let L=[...T];
  if(window._af==="assigned") L=L.filter(t=>t.type==="assigned");
  else if(window._af==="pool") L=L.filter(t=>t.type==="pool");
  else if(window._af==="private") L=L.filter(t=>t.type==="private");
  else if(window._af==="pending") L=L.filter(t=>t.status==="pending");
  else if(window._af==="accepted") L=L.filter(t=>t.status==="accepted");
  else if(window._af==="completed") L=L.filter(t=>t.status==="completed");
  $("all-tasks-list").innerHTML=L.length?L.map(t=>adminCard(t)).join(""):empty("🎉","No tasks match this filter");
}

function adminCard(t){
  const tc={assigned:"tag-cyan",pool:"tag-gold",private:"tag-purple"}[t.type]||"tag-gray";
  const tl={assigned:"Assigned",pool:"Open Pool",private:"🔒 Private"}[t.type]||t.type;
  const sc={pending:"tag-gray",accepted:"tag-gold",completed:"tag-green"}[t.status];
  let ts="";
  if(t.type==="assigned"&&(t.acceptedBy||[]).length>0)
    ts=t.acceptedBy.map(a=>{
      const done=(t.completedBy||[]).find(c=>c.uid===a.uid);
      return `<div class="time-stamp">⚡ <strong>${a.name}</strong> started: ${fmt(a.startedAt)}</div>`+
             (done?`<div class="time-stamp done">✅ <strong>${done.name}</strong> completed: ${fmt(done.completedAt)}</div>`:"");
    }).join("");
  if(t.type==="pool"&&(t.claims||[]).length>0)
    ts=t.claims.map(c=>
      `<div class="time-stamp">⚡ <strong>${c.name}</strong> started: ${fmt(c.startedAt)}</div>`+
      (c.completedAt?`<div class="time-stamp done">✅ <strong>${c.name}</strong> done: ${fmt(c.completedAt)}</div>`:"")
    ).join("");
  if(t.type==="private"&&t.completedAt)
    ts=`<div class="time-stamp done">✅ Completed: ${fmt(t.completedAt)}</div>`;
  return `<div class="task-accept-card">
    <div class="task-card-top">
      <div style="flex:1;">
        <div class="task-title">${t.title}</div>
        ${t.desc?`<div class="task-desc">${t.desc}</div>`:""}
        <div class="task-meta" style="margin-top:8px;">
          <span class="tag ${tc}">${tl}</span>
          <span class="tag ${sc}">${t.status}</span>
          ${t.tag?`<span class="tag tag-soft">${t.tag}</span>`:""}
          ${t.due?`<span class="task-date">📅 ${t.due}</span>`:""}
          ${(t.uploads||[]).length>0?`<span class="tag tag-cyan">📎 ${t.uploads.length} file(s)</span>`:""}
          ${(t.subtasks||[]).length>0?`<span class="tag tag-soft">📋 ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length} steps</span>`:""}
          ${(t.comments||[]).length>0?`<span class="tag tag-soft">💬 ${t.comments.length} note(s)</span>`:""}
          ${t.isFollowUp?`<span class="followup-badge">🔁 Follow-up</span>`:""}
          ${t.hasFollowUp?`<span class="followup-badge">🔁 Has follow-up</span>`:""}
        </div>
        ${ts?`<div style="margin-top:8px;">${ts}</div>`:""}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;flex-direction:column;align-items:flex-end;">
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="openEditTask('${t.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">Del</button>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="openSubtaskModal('${t.id}')">📋 Steps</button>
          <button class="btn btn-ghost btn-sm" onclick="openCommentsModal('${t.id}')">💬 Notes</button>
          <button class="btn btn-ghost btn-sm" onclick="openFollowUpModal('${t.id}')">🔁 Follow-up</button>
        </div>
      </div>
    </div>
    ${mediaPreviewHTML(t.uploads, t.id)}
  </div>`;
}

function subtaskProgressHTML(t){
  const subs=t.subtasks||[];
  if(!subs.length) return "";
  const done=subs.filter(s=>s.done).length;
  const pct=Math.round(done/subs.length*100);
  return `<div class="subtask-progress-inline">
    <div style="background:rgba(0,229,255,.1);border-radius:20px;height:5px;width:80px;overflow:hidden;">
      <div style="background:${pct===100?'var(--green)':'var(--cyan)'};height:100%;width:${pct}%;border-radius:20px;"></div>
    </div>
    <span>${done}/${subs.length} steps</span>
  </div>`;
}

function taskActionBtns(t){
  const subs=t.subtasks||[];
  const comments=t.comments||[];
  const hasFollowUp=t.hasFollowUp;
  return `<div class="action-btns-row">
    <button class="btn btn-ghost btn-sm" onclick="openSubtaskModal('${t.id}')">
      📋 Steps ${subs.length>0?`(${subs.filter(s=>s.done).length}/${subs.length})`:""}
    </button>
    <button class="btn btn-ghost btn-sm" onclick="openCommentsModal('${t.id}')">
      💬 Notes ${comments.length>0?`(${comments.length})`:""}
    </button>
    <button class="btn btn-ghost btn-sm" onclick="openFollowUpModal('${t.id}')">
      🔁 Follow-up ${hasFollowUp?'<span class="followup-badge">linked</span>':""}
    </button>
    <button class="btn btn-ghost btn-sm" onclick="shareTask('${t.id}')">
      🔗 Share
    </button>
  </div>`;
}

function fullTaskCard(t, tagCls, tagLabel, actions){
  const subs=t.subtasks||[];
  const comments=t.comments||[];
  return `<div class="task-accept-card">
    <div class="task-card-top">
      <div style="flex:1;">
        <div class="task-title">${t.title}</div>
        ${t.desc?`<div class="task-desc">${t.desc}</div>`:""}
        <div class="task-meta" style="margin-top:8px;">
          <span class="tag ${tagCls}">${tagLabel}</span>
          ${t.tag?`<span class="tag tag-soft">${t.tag}</span>`:""}
          <span class="pri-tag-${t.priority||"low"}">${t.priority}</span>
          ${t.due?`<span class="task-date">📅 ${t.due}</span>`:""}
          ${(t.uploads||[]).length>0?`<span class="tag tag-cyan">📎 ${t.uploads.length} file(s)</span>`:""}
          ${t.isFollowUp?`<span class="followup-badge">🔁 Follow-up</span>`:""}
          ${t.hasFollowUp?`<span class="followup-badge">🔁 Has follow-up</span>`:""}
        </div>
        ${subtaskProgressHTML(t)}
      </div>
    </div>
    <div class="task-actions" style="margin-top:12px;">${actions}</div>
    ${taskActionBtns(t)}
    ${mediaPreviewHTML(t.uploads, t.id)}

// ── TASK ACTIONS ──────────────────────────────────
window.acceptTask = async id => {
  const t=(window._tasks||[]).find(x=>x.id===id); if(!t) return;
  if((t.acceptedBy||[]).find(a=>a.uid===cu.id)) return;
  const entry={uid:cu.id,name:cu.name,startedAt:Timestamp.now()};
  await updateDoc(doc(db,"tasks",id),{acceptedBy:[...(t.acceptedBy||[]),entry],status:"accepted"});
  await logAct(`${cu.name} accepted: "${t.title}"`, "accept", id);
  await notifyAdmins(`${cu.name} accepted: "${t.title}" — Started ${fmt(entry.startedAt)}`, "accept", id);
  toast("Task accepted! Start time recorded ⚡","success");
};

window.completeTask = async id => {
  const t=(window._tasks||[]).find(x=>x.id===id); if(!t) return;
  openConfirmComplete(id, t.title, async () => {
    const entry={uid:cu.id,name:cu.name,completedAt:Timestamp.now()};
    await updateDoc(doc(db,"tasks",id),{completedBy:[...(t.completedBy||[]),entry],status:"completed"});
    await logAct(`${cu.name} completed: "${t.title}"`, "complete", id);

window.saveTask = async () => {
  const title=$("task-title-input").value.trim();
  if(!title) return toast("Please enter a task title.","error");
  const type=$("task-type-input").value;
  const assignees=type==="assigned"?[...document.querySelectorAll("#assign-boxes input:checked")].map(c=>c.value):[];
  const sharedWith=type==="private"?[...document.querySelectorAll("#share-boxes input:checked")].map(c=>c.value):[];
  const data={title,desc:$("task-desc-input").value.trim(),priority:$("task-priority-input").value,
    due:$("task-due-input").value.trim(),tag:$("task-tag-input").value.trim(),type,assignees,sharedWith};
  $("save-task-btn").textContent="Saving...";
  try {
    let taskId=editingTaskId;
    if(editingTaskId){
      await updateDoc(doc(db,"tasks",editingTaskId),data);
      await logAct(`${cu.name} updated: "${title}"`, "edit", editingTaskId);
      toast("Updated ✓","success");
    } else {
      const ref=await addDoc(collection(db,"tasks"),{...data,status:"pending",acceptedBy:[],
        completedBy:[],claims:[],uploads:[],subtasks:[],comments:[],ownerId:cu.id,createdBy:cu.id,createdAt:serverTimestamp()});
      taskId=ref.id;
      await logAct(`${cu.name} created ${type} task: "${title}"`, "create", ref.id);
      toast("Task created ⚡","success");
    }
    const pending=window._pendingAttachments||[];
    if(pending.length>0 && taskId){
      $("save-task-btn").textContent=`Uploading ${pending.length} file(s)...`;
      const t=editingTaskId?(window._tasks||[]).find(x=>x.id===taskId):null;
      const existingUploads=t?.uploads||[];
      const newUploads=[];
      for(let i=0;i<pending.length;i++){
        const file=pending[i];
        $("save-task-btn").textContent=`Uploading ${i+1}/${pending.length}...`;
        try {
          const result=await uploadToCloudinary(file,()=>{});
          newUploads.push({url:result.secure_url,type:file.type,name:file.name,
            uploadedBy:cu.name,uploadedById:cu.id,uploadedAt:new Date().toISOString(),publicId:result.public_id});
        } catch(e){ toast(`Failed to upload ${file.name}`,"error"); }
      }
      if(newUploads.length>0){
        await updateDoc(doc(db,"tasks",taskId),{uploads:[...existingUploads,...newUploads]});
        await logAct(`${cu.name} attached ${newUploads.length} file(s) to: "${title}"`, "upload", taskId);
      }
      window._pendingAttachments=[];
      toast(`Task saved with ${newUploads.length} file(s) attached ✅`,"success");
    }
    closeModal("task-modal");
  } catch(e){ toast("Error: "+e.message,"error"); }
  $("save-task-btn").textContent=editingTaskId?"Save Changes":"Create Task";
};

window.openStatModal = (filter) => {

      myAss.filter(t=>t.status==="pending");

      });

        return false;
      });
  } else {

      ...myAss,

    $("stat-modal-body").innerHTML = empty("🎉","No tasks in this category yet");

      </div>` : "";
    let timestamps = "";
    if(t.status==="completed"){
      if(t.type==="assigned"&&(t.completedBy||[]).length>0)
        timestamps = t.completedBy.map(c=>`<div class="time-stamp done" style="margin-top:4px;">✅ ${c.name} — ${fmt(c.completedAt)}</div>`).join("");
      else if(t.type==="pool"&&(t.claims||[]).filter(c=>c.completedAt).length>0)

      else if(t.completedAt)

window.openCompletedReport = () => {
  if(cu.role!=="admin"){ toast("Completion report is for admins only","error"); return; }
  const T = window._tasks || [];
  const completed = T.filter(t => t.status === "completed");
  if (!completed.length) {
    $("report-body").innerHTML = empty("🎉","No completed tasks yet");
    $("report-modal").classList.add("open");
    return;
  }
  const sorted = [...completed].sort((a,b) => {
    const aTime = getCompletedTime(a);
    const bTime = getCompletedTime(b);
    if (!aTime) return 1; if (!bTime) return -1;
    return bTime.seconds - aTime.seconds;
  });
  $("report-body").innerHTML = sorted.map(t => {
    const typeLabel = {assigned:"👤 Assigned",pool:"🌊 Pool",private:"🔒 Private"}[t.type]||t.type;
    const typeCls   = {assigned:"tag-cyan",pool:"tag-gold",private:"tag-purple"}[t.type]||"tag-gray";
    let completions = "";
    if (t.type==="assigned" && (t.completedBy||[]).length>0) {
      completions = t.completedBy.map(c=>`
        <div class="report-entry">
          <div class="report-who">
            <div class="mini-avatar">${ini(c.name||"?")}</div>
            <strong>${c.name||"Unknown"}</strong>
            ${c.uid===cu.id?`<button class="btn btn-ghost btn-sm" style="margin-left:auto;font-size:.6rem;" onclick="undoComplete('${t.id}')">↩ Undo</button>`:""}
          </div>
          <div class="report-time">✅ Completed: ${fmt(c.completedAt)}</div>
          ${t.acceptedBy?.find(a=>a.uid===c.uid)?`<div class="report-time">⚡ Started: ${fmt(t.acceptedBy.find(a=>a.uid===c.uid).startedAt)}</div>`:""}
        </div>`).join("");
    } else if (t.type==="pool" && (t.claims||[]).length>0) {
      completions = t.claims.filter(c=>c.completedAt).map(c=>`
        <div class="report-entry">
          <div class="report-who">
            <div class="mini-avatar">${ini(c.name||"?")}</div>
            <strong>${c.name||"Unknown"}</strong>
          </div>
          <div class="report-time">⚡ Started: ${fmt(c.startedAt)}</div>
          <div class="report-time">✅ Completed: ${fmt(c.completedAt)}</div>
        </div>`).join("");
    } else if (t.type==="private") {
      if((t.privateCompletedBy||[]).length>0){
        completions = t.privateCompletedBy.map(c=>`
          <div class="report-entry">
            <div class="report-who">
              <div class="mini-avatar" style="background:var(--purple);color:#fff;">${ini(c.name||"?")}</div>
              <strong>${c.name||"Unknown"}</strong>
            </div>
            ${t.privateAcceptedBy?.find(a=>a.uid===c.uid)?`<div class="report-time">⚡ Started: ${fmt(t.privateAcceptedBy.find(a=>a.uid===c.uid).startedAt)}</div>`:""}
            <div class="report-time">✅ Completed: ${fmt(c.completedAt)}</div>
          </div>`).join("");
      } else {
        completions=`<div class="report-entry"><div class="report-time">✅ Completed: ${fmt(t.completedAt)}</div></div>`;
      }
    }
    const uploads = (t.uploads||[]).length;
    return `<div class="report-card">
      <div class="report-card-header">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
          <div>
            <div class="report-title">${t.title}</div>
            <div class="task-meta" style="margin-top:6px;">
              <span class="tag ${typeCls}">${typeLabel}</span>
              ${t.tag?`<span class="tag tag-soft">${t.tag}</span>`:""}
              ${uploads>0?`<span class="tag tag-cyan">📎 ${uploads} file(s)</span>`:""}
            </div>
          </div>
          <button class="btn btn-green btn-sm" style="flex-shrink:0;" onclick="downloadSingleTaskPDF('${t.id}')">⬇ PDF</button>
        </div>
      </div>
      ${completions}
    </div>`;
  }).join("");
  $("report-modal").classList.add("open");
};

function getCompletedTime(t) {
  if (t.type==="assigned" && (t.completedBy||[]).length>0) return t.completedBy[0].completedAt;
  if (t.type==="pool" && (t.claims||[]).find(c=>c.completedAt)) return t.claims.find(c=>c.completedAt).completedAt;
  if (t.type==="private" && t.completedAt) return t.completedAt;
  return null;
}

function buildPeopleHTML(t) {
  if(t.type==="assigned" && (t.completedBy||[]).length>0){
    return t.completedBy.map(c=>{
      const started = (t.acceptedBy||[]).find(a=>a.uid===c.uid);
      return `<div class="person-row">
        <div class="person-name">👤 ${c.name||"Unknown"}</div>
        ${started?`<div class="time-row">⚡ <span>Started:</span> ${fmt(started.startedAt)}</div>`:""}
        <div class="time-row">✅ <span>Completed:</span> ${fmt(c.completedAt)}</div>
      </div>`;
    }).join("");
  } else if(t.type==="pool" && (t.claims||[]).filter(c=>c.completedAt).length>0){
    return t.claims.filter(c=>c.completedAt).map(c=>`
      <div class="person-row">
        <div class="person-name">👤 ${c.name||"Unknown"}</div>
        <div class="time-row">⚡ <span>Started:</span> ${fmt(c.startedAt)}</div>
        <div class="time-row">✅ <span>Completed:</span> ${fmt(c.completedAt)}</div>
      </div>`).join("");
  } else if(t.type==="private"){
    const completors = (t.privateCompletedBy||[]);
    if(completors.length>0){
      return completors.map(c=>{
        const started = (t.privateAcceptedBy||[]).find(a=>a.uid===c.uid);
        return `<div class="person-row">
          <div class="person-name">🔒 ${c.name||"Unknown"}</div>
          ${started?`<div class="time-row">⚡ <span>Started:</span> ${fmt(started.startedAt)}</div>`:""}
          <div class="time-row">✅ <span>Completed:</span> ${fmt(c.completedAt)}</div>
        </div>`;
      }).join("");
    }
    return `<div class="person-row"><div class="time-row">✅ <span>Completed:</span> ${fmt(t.completedAt)}</div></div>`;
  }
  return "";
}

function buildTaskBlock(t) {
  const typeLabel = {assigned:"Assigned",pool:"Open Pool",private:"Private"}[t.type]||t.type;
  const typeCls   = {assigned:"tag-assigned",pool:"tag-pool",private:"tag-private"}[t.type]||"";
  const priCls    = {high:"tag-pri-high",medium:"tag-pri-medium",low:"tag-pri-low"}[t.priority||"low"]||"";
  const uploads   = t.uploads||[];
  const people    = buildPeopleHTML(t);
  return `<div class="task-block">
    <div class="task-header">
      <div class="task-title">${t.title}</div>
      ${t.desc?`<div class="task-desc">${t.desc}</div>`:""}
      <div class="task-tags">
        <span class="tag ${typeCls}">${typeLabel}</span>
        ${t.priority?`<span class="tag ${priCls}">${t.priority} priority</span>`:""}
        ${t.tag?`<span class="tag tag-cat">${t.tag}</span>`:""}
        ${t.due?`<span class="tag tag-cat">📅 Due: ${t.due}</span>`:""}
      </div>
    </div>
    <div class="task-body">
      ${people}
      ${uploads.length>0?`<div class="uploads-row">📎 ${uploads.length} file(s): ${uploads.map(u=>u.name).join(", ")}</div>`:""}
    </div>
  </div>`;
}

async function renderNotifs(){
  const N=window._notifs||[];
  for(const n of N.filter(x=>!x.read)) await updateDoc(doc(db,"notifications",n.id),{read:true});
  const typeClass=t=>{
    if(t==="complete") return "type-complete";
    if(t==="accept") return "type-accept";
    if(t==="upload") return "type-upload";
    if(t==="comment") return "type-comment";
    if(t==="approval") return "type-approval";
    return "";
  };
  $("notif-list").innerHTML=N.length?N.map(n=>`
    <div class="notif-item ${typeClass(n.type)}">
      <div>${n.msg}</div><div class="notif-time">${fmt(n.createdAt)}</div>
    </div>`).join(""):`<div style="color:var(--muted);text-align:center;padding:20px;font-size:.82rem;">No notifications</div>`;
}

window.openSubtaskModal = async (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId); if(!t) return;

  $("subtask-title-display").textContent=t.title;

function renderSubtaskList(t) {
  const subs=t.subtasks||[];
  if(!subs.length){
    $("subtask-list").innerHTML=`<div style="color:var(--muted);font-size:.82rem;text-align:center;padding:16px;">No steps added yet</div>`;
    return;
  }
  const done=subs.filter(s=>s.done).length;
  $("subtask-list").innerHTML=`
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:.72rem;color:var(--soft);font-family:'Orbitron',sans-serif;text-transform:uppercase;letter-spacing:.08em;">Progress</span>
        <span style="font-size:.72rem;color:var(--cyan);font-family:'Orbitron',sans-serif;">${done}/${subs.length}</span>
      </div>
      <div style="background:rgba(0,229,255,.1);border-radius:20px;height:6px;overflow:hidden;">
        <div style="background:var(--cyan);height:100%;width:${subs.length?Math.round(done/subs.length*100):0}%;border-radius:20px;transition:width .3s;"></div>
      </div>
    </div>
    ${subs.map((s,i)=>`
      <div class="subtask-item ${s.done?'subtask-done':''}">
        <input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${t.id}',${i})" style="width:auto;margin:0;cursor:pointer;accent-color:var(--green);">
        <span class="subtask-text">${s.text}</span>
        ${cu.role==="admin"?`<button onclick="deleteSubtask('${t.id}',${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;margin-left:auto;padding:0 4px;" title="Remove step">✕</button>`:""}
      </div>`).join("")}`;
}

window.addSubtask = async () => {
  const taskId=$("subtask-task-id").value;
  const text=$("new-subtask-input").value.trim();
  if(!text) return;
  const t=(window._tasks||[]).find(x=>x.id===taskId); if(!t) return;
  const subs=[...(t.subtasks||[]),{text,done:false,addedBy:cu.name,addedAt:new Date().toISOString()}];
  await updateDoc(doc(db,"tasks",taskId),{subtasks:subs});
  $("new-subtask-input").value="";
  toast("Step added ✓","success");
};

window.toggleSubtask = async (taskId,idx) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId); if(!t) return;
  const subs=(t.subtasks||[]).map((s,i)=>i===idx?{...s,done:!s.done,doneBy:cu.name,doneAt:new Date().toISOString()}:s);
  const allDone=subs.length>0&&subs.every(s=>s.done);
  await updateDoc(doc(db,"tasks",taskId),{subtasks:subs});
  if(allDone) toast("All steps complete! Don't forget to mark the task done ✅","info");
};

window.deleteSubtask = async (taskId,idx) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId); if(!t) return;
  const subs=(t.subtasks||[]).filter((_,i)=>i!==idx);
  await updateDoc(doc(db,"tasks",taskId),{subtasks:subs});
};

  }
  $("intel-list").innerHTML=intel.map(i=>`
    <div style="background:var(--card);border-radius:8px;padding:12px;margin-bottom:8px;border-left:2px solid var(--purple);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">
        <div style="font-weight:500;color:var(--text);font-size:.85rem;">${i.by||"Unknown"}</div>
        <span style="font-size:.7rem;color:var(--muted);">${fmt(i.createdAt)}</span>
      </div>
      ${i.url?`<a href="${i.url}" target="_blank" style="color:var(--cyan);text-decoration:none;font-size:.82rem;word-break:break-all;">📎 ${i.url}</a><br>`:""} 
      ${i.text?`<div style="color:var(--soft);font-size:.82rem;margin-top:6px;">${(i.text||"").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>`:""}
      ${cu.role==="admin"?`<button onclick="deleteIntel('${i.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.7rem;margin-top:6px;">🗑️ Delete</button>`:""}
    </div>`).join("");
}

window.openIntelUpload = (taskId) => {
  if(!taskId) return;
  $("intel-task-id").value=taskId;
  $("intel-url").value="";
  $("intel-text").value="";
  $("intel-modal").classList.add("open");
};

window.saveIntel = async () => {
  const taskId=$("intel-task-id").value;
  const url=$("intel-url").value.trim();
  const text=$("intel-text").value.trim();
  
  if(!url && !text) { toast("Add a link or note","error"); return; }
  
  try{
    await addDoc(collection(db,"intel"),{
      taskId,by:cu.name,url,text,createdAt:serverTimestamp()
    });
    toast("Intel shared ✓","success");
    closeModal("intel-modal");
    subscribeIntel(taskId);
  }catch(e){
    logDiag("Error saving intel: "+e.message,"error");
    toast("Error sharing intel","error");
  }
};

window.deleteIntel = async (intelId) => {
  try{
    await deleteDoc(doc(db,"intel",intelId));
    toast("Deleted ✓","success");
  }catch(e){
    logDiag("Error deleting intel: "+e.message,"error");
  }
};

window.shareTask = (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  $("share-task-id").value=taskId;
  $("share-link-display").innerHTML="";
  $("share-with-list").innerHTML="";
  renderShareList(t);
  $("share-modal").classList.add("open");
};

function renderShareList(t) {
  const sharedWith=t.sharedWith||[];
  $("share-with-list").innerHTML=sharedWith.length?sharedWith.map(id=>`
    <div style="background:var(--card);padding:8px 12px;border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;">
      <span>${id}</span>
      ${cu.role==="admin"?`<button onclick="unshareTask('${t.id}','${id}')" style="background:none;border:none;color:var(--muted);cursor:pointer;">✕</button>`:""}
    </div>`).join(""):`<div style="color:var(--muted);font-size:.82rem;padding:12px;text-align:center;">Not shared yet</div>`;
}

window.copyShareLink = () => {
  const taskId=$("share-task-id").value;
  const link=window.location.origin+"?shared="+taskId;
  navigator.clipboard.writeText(link).then(()=>toast("Link copied ✓","success")).catch(()=>toast("Copy failed","error"));
};

window.unshareTask = async (taskId, userId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  const updated=(t.sharedWith||[]).filter(id=>id!==userId);
  await updateDoc(doc(db,"tasks",taskId),{sharedWith:updated});
  renderShareList(t);
};

window.openTaskDetailModal = (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  $("detail-task-title").textContent=t.title;
  $("detail-task-desc").textContent=t.desc||"No description";
  $("detail-task-priority").textContent=(t.priority||"medium").toUpperCase();
  $("detail-task-status").textContent=(t.status||"pending").toUpperCase();
  $("detail-task-created").textContent=fmt(t.createdAt);
  $("detail-task-created-by").textContent=t.createdBy||"Unknown";
  $("detail-modal").classList.add("open");
};

window.cancelAccept = async (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  await updateDoc(doc(db,"tasks",taskId),{status:"pending",acceptedBy:null,acceptedAt:null});
  toast("Acceptance cancelled","info");
  closeModal("detail-modal");
};

window.cancelClaim = async (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  await updateDoc(doc(db,"tasks",taskId),{status:"pending",claimedBy:null,claimedAt:null});
  toast("Claim cancelled","info");
  closeModal("detail-modal");
};

window.cancelPrivateStart = async (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  await updateDoc(doc(db,"tasks",taskId),{status:"pending",startedBy:null,startedAt:null});
  toast("Start cancelled","info");
  closeModal("detail-modal");
};

window.openConfirmComplete = (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t || t.status==="completed") return;
  $("complete-task-id").value=taskId;
  $("complete-note").value="";
  $("confirm-complete-modal").classList.add("open");
};

window.confirmComplete = async () => {
  const taskId=$("complete-task-id").value;
  const note=$("complete-note").value.trim();
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  
  await updateDoc(doc(db,"tasks",taskId),{
    status:"completed",
    completedBy:cu.name,
    completedAt:serverTimestamp(),
    completionNote:note
  });
  toast("Task marked complete ✓","success");
  closeModal("confirm-complete-modal");
  renderPage(currentPage);
};

window.undoComplete = async (taskId) => {
  const t=(window._tasks||[]).find(x=>x.id===taskId);
  if(!t) return;
  await updateDoc(doc(db,"tasks",taskId),{
    status:"pending",
    completedBy:null,
    completedAt:null,
    completionNote:""
  });
  toast("Completion undone","info");
  renderPage(currentPage);
};

// ── MOBILE NAVIGATION ────────────────────────────
window.toggleMobileNav = () => {
  const nav=$("mobile-nav");
  if(nav) nav.classList.toggle("open");
};

window.closeMobileNav = () => {
  const nav=$("mobile-nav");
  if(nav) nav.classList.remove("open");
};

// ── MODAL CLOSING ────────────────────────────────
window.closeModal = (modalId) => {
  const m=document.getElementById(modalId);
  if(m) m.classList.remove("open");
  editingTaskId=null;
};

// ── DOM READY & EVENT LISTENERS ──────────────────
document.addEventListener("DOMContentLoaded", async () => {
  logDiag("DOM ready, initializing app");
  
  onAuthStateChanged(auth, u => {
    if(!u) return window.location.href="?login";
    cu={id:u.uid,name:u.displayName||"User",email:u.email,role:"worker"};
    
    getDoc(doc(db,"admins",u.uid)).then(snap=>{
      if(snap.exists()) cu.role="admin";
      logDiag(`User ${u.email} loaded with role: ${cu.role}`);
      renderPage("dashboard");
    });
  });
  
  // Task form
  $("task-form")?.addEventListener("submit",e=>{e.preventDefault();saveTask();});
  
  // Priority filter
  document.querySelectorAll("[data-priority]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      priorityFilter=btn.dataset.priority;
      renderPage("dashboard");
    });
  });
  
  // Close modals on outside click
  document.querySelectorAll(".modal").forEach(m=>{
    m.addEventListener("click",e=>{
      if(e.target===m) closeModal(m.id);
    });
  });
  
  // Mobile nav
  document.addEventListener("click",e=>{
    if(!e.target.closest("nav") && !e.target.closest("[data-menu-btn]")){
      closeMobileNav();
    }
  });
});
</script>
</html>
